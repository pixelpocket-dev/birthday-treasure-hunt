<html lang="en">

<meta charset="UTF-8">

  name="viewport"

<title>Birthday Treasure Hunt ❤️</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  min-height: 100dvh;

  font-family: Georgia, "Times New Roman", serif;
  color: #292525;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 18px 12px;

  position: relative;
  overflow: hidden;

  transition: background 0.6s ease;
}


/* =========================================================
   COLOUR SCHEMES — AS REQUESTED
========================================================= */

/* 1 — Pink + Coral */
body.theme1 {
  background: linear-gradient(135deg, #ffd1dc, #ffaaa0);
}

/* 2 — Purple + Pink */
body.theme2 {
  background: linear-gradient(135deg, #d1baff, #f2b8d5);
}

/* 3 — Blue + Turquoise */
body.theme3 {
  background: linear-gradient(135deg, #b9e7ff, #a9eee1);
}

/* 4 — Peach + Pink */
body.theme4 {
  background: linear-gradient(135deg, #ffd0b5, #f6bfd5);
}

/* 5 — Red + Orange */
body.theme5 {
  background: linear-gradient(135deg, #ffaaa0, #ffc36f);
}

/* 6 — Lavender + Pink */
body.theme6 {
  background: linear-gradient(135deg, #d9c8ff, #f4c4dd);
}

/* 7 — Baby Blue + Lilac */
body.theme7 {
  background: linear-gradient(135deg, #c7e9ff, #ddd0f4);
}

/* 8 — Green + Yellow */
body.theme8 {
  background: linear-gradient(135deg, #c8edb0, #fff0a4);
}

/* 9 — Orange + Red */
body.theme9 {
  background: linear-gradient(135deg, #ffc06f, #ff9585);
}

/* 10 — Pink + Red + Silver */
body.theme10 {
  background: linear-gradient(
    135deg,
    #ffc0d0,
    #ff9eb5,
    #eeeeF2
  );
}


/* =========================================================
   DECORATIONS
========================================================= */

.decorations {
  position: fixed;
  inset: 0;

  width: 100%;
  height: 100%;

  pointer-events: none;
  overflow: hidden;

  z-index: 1;
}

.decoration {
  position: absolute;

  user-select: none;
  pointer-events: none;

  animation:
    floatAround var(--floatTime) ease-in-out infinite alternate,
    sway var(--swayTime) ease-in-out infinite alternate;

  animation-delay: var(--delay);

  opacity: var(--opacity);

  transform: rotate(var(--rotation));

  filter:
    drop-shadow(0 2px 2px rgba(0, 0, 0, 0.08));
}

@keyframes floatAround {

  from {
    transform:
      translateY(0)
      rotate(var(--rotation));
  }

  to {
    transform:
      translateY(-14px)
      rotate(calc(var(--rotation) + 8deg));
  }

}

@keyframes sway {

  from {
    margin-left: -8px;
  }

  to {
    margin-left: 8px;
  }

}


/* =========================================================
   MAIN CARD
========================================================= */

.page {
  width: 100%;
  max-width: 620px;

  position: relative;

  z-index: 5;
}

.card {

  width: 100%;

  background: rgba(255, 255, 255, 0.64);

  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);

  border-radius: 28px;

  padding: 32px 23px 36px;

  box-shadow:
    0 15px 45px rgba(70, 30, 50, 0.14),
    0 3px 10px rgba(70, 30, 50, 0.07);

  text-align: center;

  position: relative;

  overflow: hidden;

  border:
    2px solid rgba(255, 255, 255, 0.64);
}


/* =========================================================
   CARD CORNER DECORATIONS
========================================================= */

.card::before {

  content: "✦";

  position: absolute;

  top: -24px;
  left: -8px;

  font-size: 105px;

  color: var(--accent);

  opacity: 0.13;

  transform: rotate(-20deg);

  pointer-events: none;
}

.card::after {

  content: "✦";

  position: absolute;

  bottom: -30px;
  right: -8px;

  font-size: 115px;

  color: var(--accent);

  opacity: 0.13;

  transform: rotate(20deg);

  pointer-events: none;
}


/* =========================================================
   TOP DECORATION
========================================================= */

.top-decoration {

  color: var(--accent);

  font-size: 20px;

  letter-spacing: 6px;

  margin-bottom: 21px;

  position: relative;

  z-index: 6;
}


/* =========================================================
   STATEMENT
========================================================= */

.statement {

  color: var(--accent);

  font-size: 22px;

  font-weight: bold;

  line-height: 1.45;

  margin: 0 auto 24px;

  position: relative;

  z-index: 6;
}


/* =========================================================
   CLUE
========================================================= */

.clue {

  position: relative;

  z-index: 6;
}

.clue p {

  font-size: 17px;

  line-height: 1.72;

  margin: 0 0 18px;
}

.clue p:last-child {
  margin-bottom: 0;
}


/* =========================================================
   DIVIDERS
========================================================= */

.divider {

  width: 58px;
  height: 2px;

  background: var(--accent);

  opacity: 0.38;

  margin: 21px auto;
}


/* =========================================================
   FINAL PAGE
========================================================= */

.final-message {

  font-size: 19px;

  line-height: 1.65;
}

.final-message .statement {

  font-size: 29px;
}

.final-message strong {

  color: var(--accent);

  font-size: 20px;
}


/* =========================================================
   FIREWORKS
========================================================= */

.fireworks {

  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;

  pointer-events: none;

  overflow: hidden;

  z-index: 6;
}

.firework {

  position: absolute;

  width: 10px;
  height: 10px;

  border-radius: 50%;
}

.firework-spark {

  position: absolute;

  left: 50%;
  top: 50%;

  width: 4px;
  height: 24px;

  border-radius: 50%;

  background: var(--fireworkColor);

  transform-origin: 50% 100%;

  animation:
    explode 1.55s ease-out forwards;

}

@keyframes explode {

  0% {

    opacity: 1;

    transform:
      translate(-50%, -50%)
      rotate(var(--angle))
      translateY(0)
      scale(0.4);
  }

  55% {
    opacity: 1;
  }

  100% {

    opacity: 0;

    transform:
      translate(-50%, -50%)
      rotate(var(--angle))
      translateY(var(--distance))
      scale(1);
  }

}


/* =========================================================
   MOBILE / SAMSUNG S22
========================================================= */

@media (max-width: 600px) {

  body {

    padding:
      14px 10px;
  }

  .page {

    max-width: 100%;
  }

  .card {

    padding:
      28px 20px 32px;

    border-radius: 25px;

    max-height:

    overflow-y: auto;
  }

  .top-decoration {

    font-size: 19px;

    letter-spacing: 5px;

    margin-bottom: 19px;
  }

  .statement {

    font-size: 22px;

    line-height: 1.42;

    margin-bottom: 23px;
  }

  }

    font-size: 29px;
  }

}


/* =========================================================

========================================================= */

  }

    margin-bottom: 14px;
  }

  .divider {

    margin:
      16px auto;
  }

/* =========================================================

========================================================= */

  }

  .divider {

    margin:
      12px auto;
  }

/* =========================================================
   RANDOM NUMBER
========================================================= */

function random(min, max) {

  return Math.random() * (max - min) + min;

}


/* =========================================================
   CREATE RANDOM DECORATIONS
========================================================= */

function createDecorations() {

  const container =
    document.getElementById("decorations");

  const card =
    document.querySelector(".card");

  container.innerHTML = "";


  const cardRect =
    card.getBoundingClientRect();


  const cardRatio =
    (cardRect.width * cardRect.height) /
    (window.innerWidth * window.innerHeight);


  let count;


  if (cardRatio > 0.80) {

    count = 28;

  } else if (cardRatio > 0.70) {

    count = 34;

  } else if (cardRatio > 0.60) {

    count = 40;

  } else {

    count = 46;

  }


  if (clueNumber === 10) {

    count += 15;

  }


  const set =
    decorationSets[clueNumber];


  for (let i = 0; i < count; i++) {


    const decoration =
      document.createElement("span");


    decoration.className =
      "decoration";


    decoration.textContent =
      set[
        Math.floor(
          Math.random() * set.length
        )
      ];


    let left;
    let top;


    const placeOutside =
      Math.random() < 0.68;


    if (placeOutside) {


      let foundPosition = false;


      for (
        let attempt = 0;
        attempt < 25;
        attempt++
      ) {


        left =
          random(2, 96);

        top =
          random(2, 96);


        const x =
          (left / 100) *
          window.innerWidth;


        const y =
          (top / 100) *
          window.innerHeight;


        const insideCard =

          x >
            cardRect.left - 35 &&

          x <
            cardRect.right + 35 &&

          y >
            cardRect.top - 35 &&

          y <
            cardRect.bottom + 35;


        if (!insideCard) {

          foundPosition = true;

          break;

        }

      }


      if (!foundPosition) {

        left =
          random(2, 96);

        top =
          random(2, 96);

      }


    } else {

      left =
        random(2, 96);

      top =
        random(2, 96);

    }


    const size =
      random(17, 40);


    decoration.style.left =
      left + "%";


    decoration.style.top =
      top + "%";


    decoration.style.fontSize =
      size + "px";


    decoration.style.setProperty(
      "--opacity",
      random(0.55, 0.95)
    );


    decoration.style.setProperty(
      "--floatTime",
      random(3, 7) + "s"
    );


    decoration.style.setProperty(
      "--swayTime",
      random(2.5, 5) + "s"
    );


    decoration.style.setProperty(
      "--delay",
      random(-5, 0) + "s"
    );


    decoration.style.setProperty(
      "--rotation",
      random(-25, 25) + "deg"
    );


    container.appendChild(
      decoration
    );

  }

}


/* =========================================================

  "#e66a89",
  "#a9afb8",
  "#d8dbe0",
  "#ffffff"
];


const fireworkColor =
  fireworkColours[
    Math.floor(
      Math.random() *
      fireworkColours.length
    )
  ];


const sparkCount = 38;


  for (
    let i = 0;
    i < sparkCount;
    i++
  ) {


    const spark =
      document.createElement("span");


    spark.className =
      "firework-spark";


    const angle =
      (360 / sparkCount) * i;


    const distance =
      random(70, 155);


    spark.style.setProperty(
      "--angle",
      angle + "deg"
    );


    spark.style.setProperty(
      "--distance",
      distance + "px"
    );


spark.style.setProperty(
  "--fireworkColor",
  fireworkColor
);


    spark.style.animationDelay =
      random(0, 0.12) + "s";


    firework.appendChild(
      spark
    );

  }


  setTimeout(() => {

    firework.remove();

  }, 1900);

}

  ];


  positions.forEach(
    (position, index) => {

      setTimeout(() => {

        createFirework(
          position[0],
          position[1]
        );

      }, index * 300);

    }
  );


  setInterval(() => {


    const position =
      positions[
        Math.floor(
          Math.random() *
          positions.length
        )
      ];


    createFirework(
      position[0],
      position[1]
    );


  }, 1050);

}


/* =========================================================
   GET CLUE NUMBER
========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


let clueNumber =
  parseInt(
    params.get("clue")
  );


if (
  isNaN(clueNumber) ||
  clueNumber < 1 ||
  clueNumber > 10
) {

  clueNumber = 1;

}


/* =========================================================
   LOAD CLUE
========================================================= */

const container =
  document.getElementById(
    "clue-container"
  );


container.innerHTML =
  clues[clueNumber];


/* =========================================================
   APPLY THEME
========================================================= */

document.body.classList.add(
  "theme" + clueNumber
);


document.documentElement.style.setProperty(
  "--accent",
  themes[clueNumber]
);


/* =========================================================
   START
========================================================= */

window.addEventListener(
  "load",
  () => {

    createDecorations();

    startFireworks();

  }
);


window.addEventListener(
  "resize",
  () => {

    createDecorations();

  }
);


</script>

</body>
</html>
