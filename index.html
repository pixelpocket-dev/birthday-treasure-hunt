<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Birthday Treasure Hunt ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: #292525;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px 15px;

      position: relative;
      overflow-x: hidden;

      transition:
        background 0.5s ease,
        color 0.5s ease;
    }

    /* ---------------------------------
       PAGE THEMES
    --------------------------------- */

    body.theme1 {
      background: linear-gradient(135deg, #ffdce5, #fff3e8);
    }

    body.theme2 {
      background: linear-gradient(135deg, #e8dcff, #ffdff0);
    }

    body.theme3 {
      background: linear-gradient(135deg, #c9f3ff, #dfffe9);
    }

    body.theme4 {
      background: linear-gradient(135deg, #ffe1cf, #ffd6e8);
    }

    body.theme5 {
      background: linear-gradient(135deg, #ffd1c1, #ffe8b8);
    }

    body.theme6 {
      background: linear-gradient(135deg, #e5d6ff, #ffd9f0);
    }

    body.theme7 {
      background: linear-gradient(135deg, #d7efff, #e7ddff);
    }

    body.theme8 {
      background: linear-gradient(135deg, #d9f5c8, #fff2b8);
    }

    body.theme9 {
      background: linear-gradient(135deg, #ffd0a8, #ffb8a8);
    }

    body.theme10 {
      background: linear-gradient(135deg, #ffcad8, #ffd9e9, #fff0c7);
    }


    /* ---------------------------------
       DECORATIONS
    --------------------------------- */

    .decorations {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .decoration {
      position: absolute;
      user-select: none;
      animation: float 5s ease-in-out infinite;
    }

    .d1 {
      top: 7%;
      left: 7%;
      font-size: 28px;
      transform: rotate(-18deg);
      animation-delay: 0s;
    }

    .d2 {
      top: 15%;
      right: 8%;
      font-size: 34px;
      transform: rotate(12deg);
      animation-delay: 1s;
    }

    .d3 {
      top: 32%;
      left: 3%;
      font-size: 21px;
      transform: rotate(8deg);
      animation-delay: 2s;
    }

    .d4 {
      top: 42%;
      right: 4%;
      font-size: 27px;
      transform: rotate(-12deg);
      animation-delay: 0.5s;
    }

    .d5 {
      top: 58%;
      left: 7%;
      font-size: 34px;
      transform: rotate(14deg);
      animation-delay: 1.5s;
    }

    .d6 {
      top: 68%;
      right: 7%;
      font-size: 23px;
      transform: rotate(-8deg);
      animation-delay: 2.5s;
    }

    .d7 {
      bottom: 13%;
      left: 13%;
      font-size: 25px;
      transform: rotate(-15deg);
      animation-delay: 1s;
    }

    .d8 {
      bottom: 8%;
      right: 13%;
      font-size: 31px;
      transform: rotate(15deg);
      animation-delay: 2s;
    }

    .d9 {
      top: 25%;
      left: 17%;
      font-size: 15px;
      animation-delay: 3s;
    }

    .d10 {
      bottom: 28%;
      right: 18%;
      font-size: 17px;
      animation-delay: 1.5s;
    }

    .d11 {
      top: 8%;
      right: 27%;
      font-size: 18px;
      transform: rotate(20deg);
      animation-delay: 2.5s;
    }

    .d12 {
      bottom: 7%;
      left: 30%;
      font-size: 19px;
      transform: rotate(-10deg);
      animation-delay: 0.5s;
    }


    @keyframes float {
      0%, 100% {
        margin-top: 0;
      }

      50% {
        margin-top: -7px;
      }
    }


    /* ---------------------------------
       MAIN CARD
    --------------------------------- */

    .page {
      width: 100%;
      max-width: 620px;
      position: relative;
      z-index: 2;
    }

    .card {
      background: rgba(255, 255, 255, 0.96);

      border-radius: 28px;

      padding: 45px 30px 48px;

      box-shadow:
        0 15px 45px rgba(70, 30, 50, 0.18),
        0 3px 10px rgba(70, 30, 50, 0.08);

      text-align: center;

      position: relative;
      overflow: hidden;

      border: 3px solid rgba(255, 255, 255, 0.8);
    }


    /* Decorative corner shapes */

    .card::before {
      content: "✦";
      position: absolute;
      top: -20px;
      left: -5px;

      font-size: 95px;
      color: var(--accent);

      opacity: 0.12;

      transform: rotate(-20deg);
    }

    .card::after {
      content: "✦";
      position: absolute;
      bottom: -25px;
      right: -5px;

      font-size: 105px;
      color: var(--accent);

      opacity: 0.12;

      transform: rotate(20deg);
    }


    /* ---------------------------------
       TOP DECORATION
    --------------------------------- */

    .top-decoration {
      color: var(--accent);

      font-size: 21px;

      letter-spacing: 7px;

      margin-bottom: 25px;

      position: relative;
      z-index: 3;
    }


    /* ---------------------------------
       STATEMENT
    --------------------------------- */

    .statement {
      color: var(--accent);

      font-size: 22px;

      font-weight: bold;

      line-height: 1.5;

      margin: 0 auto 30px;

      position: relative;
      z-index: 3;
    }


    /* ---------------------------------
       CLUE
    --------------------------------- */

    .clue {
      position: relative;
      z-index: 3;
    }

    .clue p {
      font-size: 18px;

      line-height: 1.9;

      margin: 0 0 22px;
    }

    .clue p:last-child {
      margin-bottom: 0;
    }


    /* ---------------------------------
       DIVIDERS
    --------------------------------- */

    .divider {
      width: 58px;
      height: 2px;

      background: var(--accent);

      opacity: 0.4;

      margin: 27px auto;
    }


    /* ---------------------------------
       FINAL MESSAGE
    --------------------------------- */

    .final-message {
      font-size: 19px;
      line-height: 1.9;
    }

    .final-message strong {
      color: var(--accent);
    }


    /* ---------------------------------
       MOBILE
    --------------------------------- */

    @media (max-width: 600px) {

      body {
        padding: 25px 12px;
      }

      .card {
        padding: 38px 21px 42px;
        border-radius: 23px;
      }

      .statement {
        font-size: 20px;
      }

      .clue p {
        font-size: 17px;
        line-height: 1.85;
      }

      .top-decoration {
        font-size: 18px;
        letter-spacing: 5px;
      }

      .decoration.d1 {
        left: 2%;
      }

      .decoration.d2 {
        right: 2%;
      }

      .decoration.d5 {
        left: 2%;
      }

      .decoration.d6 {
        right: 2%;
      }

      .decoration.d7 {
        left: 5%;
      }

      .decoration.d8 {
        right: 5%;
      }
    }
  </style>
</head>


<body>

  <!-- ---------------------------------
       BIRTHDAY DECORATIONS
  ---------------------------------- -->

  <div class="decorations">

    <span class="decoration d1">🎈</span>
    <span class="decoration d2">🎀</span>
    <span class="decoration d3">✦</span>
    <span class="decoration d4">🎁</span>
    <span class="decoration d5">🎉</span>
    <span class="decoration d6">★</span>
    <span class="decoration d7">🎈</span>
    <span class="decoration d8">🎊</span>
    <span class="decoration d9">✦</span>
    <span class="decoration d10">♥</span>
    <span class="decoration d11">✧</span>
    <span class="decoration d12">🎀</span>

  </div>


  <main class="page">

    <div class="card">

      <div class="top-decoration">
        ✦ 🎉 ✦
      </div>

      <div id="clue-container"></div>

    </div>

  </main>


  <script>

    /* ---------------------------------
       CLUES
    ---------------------------------- */

    const clues = {

      1: `
        <p class="statement">
          Ready or not...<br>
          your birthday adventure starts now! 🎉
        </p>

        <div class="clue">

          <p>
            Your clue is green and creamy too,<br>
            And there's a little surprise waiting for you.
          </p>

          <div class="divider"></div>

          <p>
            It's made with love, especially for you,<br>
            A little something tasty, a little something new.
          </p>

          <div class="divider"></div>

          <p>
            Think of something delicious, made with care,<br>
            Your first little treasure is waiting somewhere.
          </p>

        </div>
      `,


      2: `
        <p class="statement">
          Look at you, making money! 😂
        </p>

        <div class="clue">

          <p>
            Well done! You found your next surprise,<br>
            But don't get too comfortable with the prize.
          </p>

          <div class="divider"></div>

          <p>
            Now go somewhere that has a view of you.
          </p>

          <p>
            Your next little treasure is waiting there too. 👀
          </p>

        </div>
      `,


      3: `
        <p class="statement">
          Feeling thirsty yet? 😂💧
        </p>

        <div class="clue">

          <p>
            Your next clue is waiting where water flows,<br>
            but where it goes, nobody knows. 💧
          </p>

          <div class="divider"></div>

          <p>
            Follow the sound and take a look,<br>
            your next surprise is hiding in this nook. 👀
          </p>

        </div>
      `,


      4: `
        <p class="statement">
          You're on a roll, so don't delay!
        </p>

        <div class="clue">

          <p>
            Your next clue is hiding where I used to stay. ❤️
          </p>

          <div class="divider"></div>

          <p>
            A room that holds a little history,<br>
            and maybe a memory or two of me. 😂
          </p>

          <div class="divider"></div>

          <p>
            Go find the room that was once mine...
          </p>

        </div>
      `,


      5: `
        <p class="statement">
          Well done! You found your way.
        </p>

        <div class="clue">

          <p>
            Now go find the place where your bum likes to stay,<br>
            when you're ready to relax at the end of the day. 😂
          </p>

          <div class="divider"></div>

          <p>
            Where you sit back, get comfy and stay,<br>
            especially when you've had a long day.
          </p>

        </div>
      `,


      6: `
        <p class="statement">
          You're getting closer, don't you know?
        </p>

        <div class="clue">

          <p>
            Now to somewhere your clothes like to go. 👗
          </p>

          <div class="divider"></div>

          <p>
            Dresses and shirts all hiding away,<br>
            waiting for you to choose them one day. 😂
          </p>

          <div class="divider"></div>

          <p>
            Go have a look where your clothes stay...
          </p>

        </div>
      `,


      7: `
        <p class="statement">
          Getting tired yet? 😂❤️
        </p>

        <div class="clue">

          <p>
            You're getting closer, don't stop the chase,<br>
            Your next clue is hiding in a very familiar place.
          </p>

          <div class="divider"></div>

          <p>
            It's somewhere soft where you rest your face,<br>
            And hopefully dream of winning this race.
          </p>

        </div>
      `,


      8: `
        <p class="statement">
          Time to leave the bedroom behind... 🌳
        </p>

        <div class="clue">

          <p>
            Your next clue is waiting outside.
          </p>

          <div class="divider"></div>

          <p>
            Look somewhere that gives a little shade,<br>
            Where nature has its own little parade.
          </p>

        </div>
      `,


      9: `
        <p class="statement">
          The garden holds one last surprise! 🌳❤️
        </p>

        <div class="clue">

          <p>
            A birthday braai means fire and food,<br>
            Good drinks, good laughs and a birthday mood. 🎂🔥
          </p>

          <div class="divider"></div>

          <p>
            So where will the flames be burning bright,<br>
            And where will we celebrate your birthday tonight?
          </p>

        </div>
      `,


      10: `
        <p class="statement">
          YOU FOUND IT! 🎉❤️
        </p>

        <div class="clue final-message">

          <p>
            I could have just handed you your birthday present,<br>
            but where's the fun in that? 😂
          </p>

          <div class="divider"></div>

          <p>
            This is a little something towards<br>
            the tattoo you've been wanting. 🖤
          </p>

          <div class="divider"></div>

          <p>
            <strong>Happy Birthday! ❤️🎀</strong>
          </p>

          <p>
            Now go get yourself some ink!
          </p>

        </div>
      `

    };


    /* ---------------------------------
       GET CLUE NUMBER
    ---------------------------------- */

    const params = new URLSearchParams(window.location.search);

    const clueNumber = parseInt(params.get("clue"));

    const container = document.getElementById("clue-container");


    /* ---------------------------------
       COLOUR THEMES
    ---------------------------------- */

    const themes = {
      1: "#e63946",
      2: "#9b5de5",
      3: "#00a6c7",
      4: "#e76f51",
      5: "#e85d04",
      6: "#9b5de5",
      7: "#6c63c7",
      8: "#55a630",
      9: "#e85d04",
      10: "#d62839"
    };


    /* ---------------------------------
       LOAD THE PAGE
    ---------------------------------- */

    const activeClue = clues[clueNumber] || clues[1];

    const activeNumber = clues[clueNumber]
      ? clueNumber
      : 1;


    container.innerHTML = activeClue;


    document.body.classList.add("theme" + activeNumber);

    document.documentElement.style.setProperty(
      "--accent",
      themes[activeNumber]
    );

  </script>

</body>
</html>
