<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Treasure Hunt ❤️</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #0b0b0b;
        color: #f5f5f5;
        font-family: Georgia, "Times New Roman", serif;
    }

    .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
    }

    .card {
        width: 100%;
        max-width: 650px;
        background: #151515;
        border: 1px solid #333;
        border-radius: 22px;
        padding: 34px 28px 38px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    }

    .heart {
        text-align: center;
        font-size: 2.5rem;
        margin-bottom: 12px;
    }

    .intro {
        text-align: center;
        color: #e63946;
        font-size: 1.25rem;
        font-weight: bold;
        line-height: 1.5;
        margin-bottom: 28px;
    }

    .poem {
        text-align: center;
        font-size: 1.13rem;
        line-height: 1.9;
    }

    .poem p {
        margin: 0 0 22px;
    }

    .poem .statement {
        color: #e63946;
        font-weight: bold;
        font-size: 1.2rem;
        line-height: 1.6;
        margin-bottom: 28px;
    }

    .final {
        text-align: center;
    }

    .final h1 {
        color: #e63946;
        font-size: 2rem;
        margin: 8px 0 28px;
    }

    .final p {
        font-size: 1.13rem;
        line-height: 1.9;
        margin: 0 0 24px;
    }

    .final-message {
        font-size: 1.25rem;
        line-height: 1.8;
        font-weight: bold;
        color: #f5f5f5;
        margin-top: 30px;
    }

    .accent {
        color: #e63946;
    }

    .bottom-heart {
        text-align: center;
        font-size: 1.5rem;
        margin-top: 30px;
    }

    @media (max-width: 480px) {
        .page {
            padding: 14px 10px;
        }

        .card {
            padding: 28px 20px 32px;
            border-radius: 18px;
        }

        .poem {
            font-size: 1.05rem;
            line-height: 1.85;
        }

        .poem .statement {
            font-size: 1.12rem;
        }

        .final h1 {
            font-size: 1.75rem;
        }
    }
</style>
</head>

<body>

<div class="page">
    <main class="card" id="content"></main>
</div>

<script>

const clues = {

    1: `
        <div class="heart">🍃</div>

        <div class="poem">
            <p class="statement">
                Ready or not... your birthday adventure starts now! 🎉
            </p>

            <p>
                Your clue is green and creamy too,<br>
                And there's a little surprise waiting for you.
            </p>

            <p>
                It's made with love, especially for you,<br>
                A little something tasty, a little something new.
            </p>

            <p>
                Think of something delicious, made with care,<br>
                Your first little treasure is waiting somewhere.
            </p>
        </div>
    `,

    2: `
        <div class="heart">🪞</div>

        <div class="poem">
            <p class="statement">
                Look at you, making money! 😂
            </p>

            <p>
                Well done! You found your next surprise,<br>
                But don't get too comfortable with the prize.
            </p>

            <p>
                Now go somewhere that has a view of you.
            </p>

            <p>
                Your next little treasure is waiting there too. 👀
            </p>
        </div>
    `,

    3: `
        <div class="heart">💧</div>

        <div class="poem">
            <p class="statement">
                Feeling thirsty yet? 😂💧
            </p>

            <p>
                Your next clue is waiting where water flows,<br>
                But where it goes, nobody knows. 💧
            </p>

            <p>
                Follow the sound and take a look,<br>
                Your next surprise is hiding in this nook. 👀
            </p>
        </div>
    `,

    4: `
        <div class="heart">🛏️</div>

        <div class="poem">
            <p class="statement">
                You're on a roll, so don't delay!
            </p>

            <p>
                Your next clue is hiding where I used to stay. ❤️
            </p>

            <p>
                A room that holds a little history,<br>
                And maybe a memory or two of me. 😂
            </p>

            <p>
                Go find the room that was once mine...
            </p>
        </div>
    `,

    5: `
        <div class="heart">🛋️</div>

        <div class="poem">
            <p class="statement">
                Well done! You found your way.
            </p>

            <p>
                Now go find the place where your bum likes to stay,<br>
                When you're ready to relax at the end of the day. 😂
            </p>

            <p>
                Where you sit back, get comfy and stay,<br>
                Especially when you've had a long day.
            </p>
        </div>
    `,

    6: `
        <div class="heart">👗</div>

        <div class="poem">
            <p class="statement">
                You're getting closer, don't you know?
            </p>

            <p>
                Now to somewhere your clothes like to go. 👗
            </p>

            <p>
                Dresses and shirts all hiding away,<br>
                Waiting for you to choose them one day. 😂
            </p>

            <p>
                Go have a look where your clothes stay...
            </p>
        </div>
    `,

    7: `
        <div class="heart">🛏️</div>

        <div class="poem">
            <p class="statement">
                Getting tired yet? 😂❤️
            </p>

            <p>
                You're getting closer, don't stop the chase,<br>
                Your next clue is hiding in a very familiar place.
            </p>

            <p>
                It's somewhere soft where you rest your face,<br>
                And hopefully dream of winning this race.
            </p>
        </div>
    `,

    8: `
        <div class="heart">🌳</div>

        <div class="poem">
            <p class="statement">
                Time to leave the bedroom behind... 🌳
            </p>

            <p>
                Your next clue is waiting outside.
            </p>

            <p>
                Look somewhere that gives a little shade,<br>
                Where nature has its own little parade.
            </p>
        </div>
    `,

    9: `
        <div class="heart">🔥</div>

        <div class="poem">
            <p class="statement">
                The garden holds one last surprise! 🌳❤️
            </p>

            <p>
                A birthday braai means fire and food,<br>
                Good drinks, good laughs and a birthday mood. 🎂🔥
            </p>

            <p>
                So where will the flames be burning bright,<br>
                And where will we celebrate your birthday tonight?
            </p>
        </div>
    `,

    10: `
        <div class="final">

            <div class="heart">🎉❤️</div>

            <h1>YOU FOUND IT! 🎉❤️</h1>

            <p>
                I could have just handed you your birthday present,<br>
                but where's the fun in that? 😂
            </p>

            <p>
                This is a little something towards<br>
                the tattoo you've been wanting. 🖤
            </p>

            <div class="final-message">
                <span class="accent">Happy Birthday! ❤️🎀</span>
                <br><br>
                Now go get yourself some ink!
            </div>

            <div class="bottom-heart">❤️</div>

        </div>
    `
};

function getClueNumber() {

    const params = new URLSearchParams(window.location.search);
    const number = parseInt(params.get("clue"));

    if (number >= 1 && number <= 10) {
        return number;
    }

    return 1;
}

function showClue() {

    const number = getClueNumber();

    document.getElementById("content").innerHTML = clues[number];

}

showClue();

</script>

</body>
</html>
