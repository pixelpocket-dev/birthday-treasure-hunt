<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Birthday Treasure Hunt ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #fff5f5 0%, transparent 35%),
        radial-gradient(circle at bottom right, #ffe8eb 0%, transparent 35%),
        #faf8f6;
      color: #292525;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 16px;
    }

    .page {
      width: 100%;
      max-width: 620px;
    }

    .card {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid #eadcdd;
      border-radius: 24px;
      padding: 38px 28px 42px;
      box-shadow:
        0 12px 35px rgba(80, 40, 45, 0.10),
        0 2px 8px rgba(80, 40, 45, 0.05);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before,
    .card::after {
      content: "♥";
      position: absolute;
      color: #e63946;
      opacity: 0.10;
      font-size: 75px;
      line-height: 1;
    }

    .card::before {
      top: -18px;
      left: -8px;
      transform: rotate(-15deg);
    }

    .card::after {
      bottom: -18px;
      right: -8px;
      transform: rotate(15deg);
    }

    .heart {
      font-size: 34px;
      margin-bottom: 16px;
    }

    .statement {
      color: #d62839;
      font-size: 22px;
      font-weight: bold;
      line-height: 1.45;
      margin: 0 auto 28px;
      position: relative;
      z-index: 1;
    }

    .clue {
      position: relative;
      z-index: 1;
    }

    .clue p {
      font-size: 18px;
      line-height: 1.9;
      margin: 0 0 22px;
    }

    .clue p:last-child {
      margin-bottom: 0;
    }

    .divider {
      width: 70px;
      height: 2px;
      background: #e63946;
      opacity: 0.35;
      margin: 28px auto;
    }

    .final-message {
      font-size: 19px;
      line-height: 1.9;
    }

    .final-message strong {
      color: #d62839;
    }

    @media (max-width: 600px) {
      body {
        padding: 18px 12px;
      }

      .card {
        padding: 32px 21px 36px;
        border-radius: 20px;
      }

      .statement {
        font-size: 20px;
      }

      .clue p {
        font-size: 17px;
        line-height: 1.85;
      }

      .heart {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <main class="page">
    <div class="card" id="clue-container"></div>
  </main>

  <script>

    const clues = {

      1: `
        <div class="heart">🍃</div>

        <p class="statement">
          Ready or not... your birthday adventure starts now! 🎉
        </p>

        <div class="clue">
          <p>
            Your clue is green and creamy too,<br>
            And there's a little surprise waiting for you.
          </p>

          <div class="divider"></div>

          <p>
            It's made with love, especially for you,<br>
            A little something tasty, a little something new.
          </p>

          <div class="divider"></div>

          <p>
            Think of something delicious, made with care,<br>
            Your first little treasure is waiting somewhere.
          </p>
        </div>
      `,

      2: `
        <div class="heart">🪞</div>

        <p class="statement">
          Look at you, making money! 😂
        </p>

        <div class="clue">
          <p>
            Well done! You found your next surprise,<br>
            But don't get too comfortable with the prize.
          </p>

          <div class="divider"></div>

          <p>
            Now go somewhere that has a view of you.
          </p>

          <p>
            Your next little treasure is waiting there too. 👀
          </p>
        </div>
      `,

      3: `
        <div class="heart">💧</div>

        <p class="statement">
          Feeling thirsty yet? 😂💧
        </p>

        <div class="clue">
          <p>
            Your next clue is waiting where water flows,<br>
            but where it goes, nobody knows. 💧
          </p>

          <div class="divider"></div>

          <p>
            Follow the sound and take a look,<br>
            your next surprise is hiding in this nook. 👀
          </p>
        </div>
      `,

      4: `
        <div class="heart">🛏️</div>

        <p class="statement">
          You're on a roll, so don't delay!
        </p>

        <div class="clue">
          <p>
            Your next clue is hiding where I used to stay. ❤️
          </p>

          <div class="divider"></div>

          <p>
            A room that holds a little history,<br>
            and maybe a memory or two of me. 😂
          </p>

          <div class="divider"></div>

          <p>
            Go find the room that was once mine...
          </p>
        </div>
      `,

      5: `
        <div class="heart">🛋️</div>

        <p class="statement">
          Well done! You found your way.
        </p>

        <div class="clue">
          <p>
            Now go find the place where your bum likes to stay,<br>
            when you're ready to relax at the end of the day. 😂
          </p>

          <div class="divider"></div>

          <p>
            Where you sit back, get comfy and stay,<br>
            especially when you've had a long day.
          </p>
        </div>
      `,

      6: `
        <div class="heart">👗</div>

        <p class="statement">
          You're getting closer, don't you know?
        </p>

        <div class="clue">
          <p>
            Now to somewhere your clothes like to go. 👗
          </p>

          <div class="divider"></div>

          <p>
            Dresses and shirts all hiding away,<br>
            waiting for you to choose them one day. 😂
          </p>

          <div class="divider"></div>

          <p>
            Go have a look where your clothes stay...
          </p>
        </div>
      `,

      7: `
        <div class="heart">🛏️</div>

        <p class="statement">
          Getting tired yet? 😂❤️
        </p>

        <div class="clue">
          <p>
            You're getting closer, don't stop the chase,<br>
            Your next clue is hiding in a very familiar place.
          </p>

          <div class="divider"></div>

          <p>
            It's somewhere soft where you rest your face,<br>
            And hopefully dream of winning this race.
          </p>
        </div>
      `,

      8: `
        <div class="heart">🌳</div>

        <p class="statement">
          Time to leave the bedroom behind... 🌳
        </p>

        <div class="clue">
          <p>
            Your next clue is waiting outside.
          </p>

          <div class="divider"></div>

          <p>
            Look somewhere that gives a little shade,<br>
            Where nature has its own little parade.
          </p>
        </div>
      `,

      9: `
        <div class="heart">🔥</div>

        <p class="statement">
          The garden holds one last surprise! 🌳❤️
        </p>

        <div class="clue">
          <p>
            A birthday braai means fire and food,<br>
            Good drinks, good laughs and a birthday mood. 🎂🔥
          </p>

          <div class="divider"></div>

          <p>
            So where will the flames be burning bright,<br>
            And where will we celebrate your birthday tonight?
          </p>
        </div>
      `,

      10: `
        <div class="heart">❤️</div>

        <p class="statement">
          YOU FOUND IT! 🎉❤️
        </p>

        <div class="clue final-message">
          <p>
            I could have just handed you your birthday present,<br>
            but where's the fun in that? 😂
          </p>

          <div class="divider"></div>

          <p>
            This is a little something towards<br>
            the tattoo you've been wanting. 🖤
          </p>

          <div class="divider"></div>

          <p>
            <strong>Happy Birthday! ❤️🎀</strong>
          </p>

          <p>
            Now go get yourself some ink!
          </p>
        </div>
      `

    };

    const params = new URLSearchParams(window.location.search);
    const clueNumber = parseInt(params.get("clue"));

    const container = document.getElementById("clue-container");

    if (clues[clueNumber]) {
      container.innerHTML = clues[clueNumber];
    } else {
      container.innerHTML = clues[1];
    }

  </script>

</body>
</html>
