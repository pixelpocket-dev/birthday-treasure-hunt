<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Birthday Treasure Hunt ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      font-family: Georgia, "Times New Roman", serif;
      color: #292525;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px 15px;

      position: relative;
      overflow-x: hidden;

      transition: background 0.6s ease;
    }


    /* =========================================
       DIFFERENT BIRTHDAY COLOURS FOR EACH PAGE
    ========================================= */

    body.theme1 {
      background: linear-gradient(135deg, #ffd6e0, #fff0e6);
    }

    body.theme2 {
      background: linear-gradient(135deg, #e3d5ff, #ffd8ef);
    }

    body.theme3 {
      background: linear-gradient(135deg, #bdefff, #d9fff0);
    }

    body.theme4 {
      background: linear-gradient(135deg, #ffd5bd, #ffd9ea);
    }

    body.theme5 {
      background: linear-gradient(135deg, #ffc8b5, #ffe5ad);
    }

    body.theme6 {
      background: linear-gradient(135deg, #dfd0ff, #ffcfe8);
    }

    body.theme7 {
      background: linear-gradient(135deg, #d0edff, #e4d9ff);
    }

    body.theme8 {
      background: linear-gradient(135deg, #d2f5c4, #fff0aa);
    }

    body.theme9 {
      background: linear-gradient(135deg, #ffc99e, #ffb9aa);
    }

    body.theme10 {
      background: linear-gradient(135deg, #ffbfd1, #ffd4e5, #ffe9ad);
    }


    /* =========================================
       DECORATIONS
    ========================================= */

    .decorations {
      position: fixed;
      inset: 0;

      pointer-events: none;

      overflow: hidden;

      z-index: 0;
    }

    .decoration {
      position: absolute;

      user-select: none;

      animation:
        floatDecoration var(--float-time) ease-in-out infinite;

      animation-delay: var(--delay);

      transform: rotate(var(--rotation));

      opacity: var(--opacity);

      font-size: var(--size);
    }


    @keyframes floatDecoration {

      0% {
        transform:
          translateY(0)
          rotate(var(--rotation));
      }

      50% {
        transform:
          translateY(-12px)
          rotate(calc(var(--rotation) + 7deg));
      }

      100% {
        transform:
          translateY(0)
          rotate(var(--rotation));
      }
    }


    /* =========================================
       DIFFERENT DECORATION SIZES
    ========================================= */

    .tiny {
      --size: 13px;
      --opacity: 0.65;
    }

    .small {
      --size: 20px;
      --opacity: 0.75;
    }

    .medium {
      --size: 30px;
      --opacity: 0.9;
    }

    .large {
      --size: 43px;
      --opacity: 0.95;
    }

    .huge {
      --size: 62px;
      --opacity: 0.9;
    }


    /* =========================================
       DIFFERENT POSITIONS
    ========================================= */

    .pos1 {
      top: 5%;
      left: 5%;
      --rotation: -18deg;
    }

    .pos2 {
      top: 9%;
      right: 8%;
      --rotation: 14deg;
    }

    .pos3 {
      top: 23%;
      left: 3%;
      --rotation: 8deg;
    }

    .pos4 {
      top: 29%;
      right: 4%;
      --rotation: -14deg;
    }

    .pos5 {
      top: 47%;
      left: 7%;
      --rotation: 18deg;
    }

    .pos6 {
      top: 53%;
      right: 6%;
      --rotation: -9deg;
    }

    .pos7 {
      bottom: 25%;
      left: 4%;
      --rotation: -12deg;
    }

    .pos8 {
      bottom: 19%;
      right: 8%;
      --rotation: 16deg;
    }

    .pos9 {
      bottom: 7%;
      left: 17%;
      --rotation: -20deg;
    }

    .pos10 {
      bottom: 8%;
      right: 20%;
      --rotation: 12deg;
    }

    .pos11 {
      top: 16%;
      left: 20%;
      --rotation: 25deg;
    }

    .pos12 {
      top: 68%;
      right: 19%;
      --rotation: -25deg;
    }

    .pos13 {
      bottom: 31%;
      left: 20%;
      --rotation: 8deg;
    }

    .pos14 {
      top: 38%;
      right: 18%;
      --rotation: -18deg;
    }


    /* =========================================
       ANIMATION SPEEDS
    ========================================= */

    .slow {
      --float-time: 6s;
      --delay: 0s;
    }

    .normal {
      --float-time: 4.5s;
      --delay: 1s;
    }

    .fast {
      --float-time: 3.5s;
      --delay: 1.8s;
    }


    /* =========================================
       MAIN CARD
    ========================================= */

    .page {
      width: 100%;
      max-width: 620px;

      position: relative;

      z-index: 5;
    }

    .card {
      background: rgba(255, 255, 255, 0.97);

      border-radius: 28px;

      padding: 45px 30px 48px;

      text-align: center;

      position: relative;

      overflow: hidden;

      border: 3px solid rgba(255, 255, 255, 0.9);

      box-shadow:
        0 18px 55px rgba(60, 30, 50, 0.18),
        0 3px 12px rgba(60, 30, 50, 0.08);
    }


    /* Soft decorative corners */

    .card::before {
      content: "✦";

      position: absolute;

      top: -27px;
      left: -7px;

      font-size: 110px;

      color: var(--accent);

      opacity: 0.10;

      transform: rotate(-20deg);
    }

    .card::after {
      content: "✦";

      position: absolute;

      bottom: -30px;
      right: -8px;

      font-size: 120px;

      color: var(--accent);

      opacity: 0.10;

      transform: rotate(20deg);
    }


    /* =========================================
       TOP DECORATION
    ========================================= */

    .top-decoration {
      color: var(--accent);

      font-size: 20px;

      letter-spacing: 7px;

      margin-bottom: 25px;

      position: relative;

      z-index: 10;
    }


    /* =========================================
       RED/COLOURFUL STATEMENT
    ========================================= */

    .statement {
      color: var(--accent);

      font-size: 22px;

      font-weight: bold;

      line-height: 1.5;

      margin: 0 auto 30px;

      position: relative;

      z-index: 10;
    }


    /* =========================================
       CLUE TEXT
    ========================================= */

    .clue {
      position: relative;

      z-index: 10;
    }

    .clue p {
      font-size: 18px;

      line-height: 1.9;

      margin: 0 0 22px;
    }

    .clue p:last-child {
      margin-bottom: 0;
    }


    /* =========================================
       DIVIDERS
    ========================================= */

    .divider {
      width: 58px;

      height: 2px;

      background: var(--accent);

      opacity: 0.4;

      margin: 27px auto;
    }


    /* =========================================
       FINAL MESSAGE
    ========================================= */

    .final-message {
      font-size: 19px;

      line-height: 1.9;
    }

    .final-message strong {
      color: var(--accent);
    }


    /* =========================================
       FIREWORKS — FINAL PAGE ONLY
    ========================================= */

    .fireworks {
      position: fixed;

      inset: 0;

      pointer-events: none;

      overflow: hidden;

      z-index: 1;
    }

    .firework {
      position: absolute;

      width: 6px;
      height: 6px;

      border-radius: 50%;

      opacity: 0;

      animation: explode 3.8s infinite;
    }


    .firework::before,
    .firework::after {
      content: "";

      position: absolute;

      width: 5px;
      height: 5px;

      border-radius: 50%;

      box-shadow:
        0 -55px 0 1px #e63946,
        39px -39px 0 1px #ff7b00,
        55px 0 0 1px #9b5de5,
        39px 39px 0 1px #00a6c7,
        0 55px 0 1px #55a630,
        -39px 39px 0 1px #f72585,
        -55px 0 0 1px #e63946,
        -39px -39px 0 1px #ffb703;
    }


    .firework::before {
      transform: rotate(22deg);
    }

    .firework::after {
      transform: rotate(67deg);
    }


    .firework.fw1 {
      top: 13%;
      left: 17%;

      animation-delay: 0s;
    }

    .firework.fw2 {
      top: 20%;
      right: 17%;

      animation-delay: 1.2s;
    }

    .firework.fw3 {
      top: 68%;
      left: 12%;

      animation-delay: 2.1s;
    }

    .firework.fw4 {
      top: 63%;
      right: 13%;

      animation-delay: 0.7s;
    }


    @keyframes explode {

      0% {
        transform: scale(0.1);
        opacity: 0;
      }

      10% {
        transform: scale(0.5);
        opacity: 1;
      }

      35% {
        transform: scale(1);
        opacity: 1;
      }

      60% {
        transform: scale(1.25);
        opacity: 0.8;
      }

      100% {
        transform: scale(1.5);
        opacity: 0;
      }
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 600px) {

      body {
        padding: 25px 12px;
      }

      .card {
        padding: 38px 21px 42px;

        border-radius: 23px;
      }

      .statement {
        font-size: 20px;
      }

      .clue p {
        font-size: 17px;

        line-height: 1.85;
      }

      .top-decoration {
        font-size: 18px;

        letter-spacing: 5px;
      }

      .huge {
        --size: 48px;
      }

      .large {
        --size: 36px;
      }

      .medium {
        --size: 26px;
      }

      .firework::before,
      .firework::after {
        box-shadow:
          0 -42px 0 1px #e63946,
          30px -30px 0 1px #ff7b00,
          42px 0 0 1px #9b5de5,
          30px 30px 0 1px #00a6c7,
          0 42px 0 1px #55a630,
          -30px 30px 0 1px #f72585,
          -42px 0 0 1px #e63946,
          -30px -30px 0 1px #ffb703;
      }
    }

  </style>
</head>


<body>

  <!-- =========================================
       BIRTHDAY DECORATIONS
  ========================================== -->

  <div class="decorations" id="decorations">

    <span class="decoration huge pos1 slow">🎈</span>

    <span class="decoration small pos2 normal">✦</span>

    <span class="decoration large pos3 fast">🎀</span>

    <span class="decoration tiny pos4 slow">✦</span>

    <span class="decoration medium pos5 normal">🎁</span>

    <span class="decoration large pos6 fast">🎉</span>

    <span class="decoration small pos7 slow">★</span>

    <span class="decoration huge pos8 normal">🎈</span>

    <span class="decoration tiny pos9 fast">✧</span>

    <span class="decoration medium pos10 slow">🎊</span>

    <span class="decoration small pos11 normal">★</span>

    <span class="decoration large pos12 fast">🎀</span>

    <span class="decoration tiny pos13 slow">✦</span>

    <span class="decoration medium pos14 normal">♥</span>

  </div>


  <!-- =========================================
       FIREWORKS
       Hidden unless clue 10 is active
  ========================================== -->

  <div class="fireworks" id="fireworks" style="display:none;">

    <div class="firework fw1"></div>
    <div class="firework fw2"></div>
    <div class="firework fw3"></div>
    <div class="firework fw4"></div>

  </div>


  <!-- =========================================
       MAIN CARD
  ========================================== -->

  <main class="page">

    <div class="card">

      <div class="top-decoration">
        ✦ 🎉 ✦
      </div>

      <div id="clue-container"></div>

    </div>

  </main>


  <script>

    /* =========================================
       ALL CLUES
    ========================================== */

    const clues = {

      1: `
        <p class="statement">
          Ready or not...<br>
          your birthday adventure starts now! 🎉
        </p>

        <div class="clue">

          <p>
            Your clue is green and creamy too,<br>
            And there's a little surprise waiting for you.
          </p>

          <div class="divider"></div>

          <p>
            It's made with love, especially for you,<br>
            A little something tasty, a little something new.
          </p>

          <div class="divider"></div>

          <p>
            Think of something delicious, made with care,<br>
            Your first little treasure is waiting somewhere.
          </p>

        </div>
      `,


      2: `
        <p class="statement">
          Look at you, making money! 😂
        </p>

        <div class="clue">

          <p>
            Well done! You found your next surprise,<br>
            But don't get too comfortable with the prize.
          </p>

          <div class="divider"></div>

          <p>
            Now go somewhere that has a view of you.
          </p>

          <p>
            Your next little treasure is waiting there too. 👀
          </p>

        </div>
      `,


      3: `
        <p class="statement">
          Feeling thirsty yet? 😂💧
        </p>

        <div class="clue">

          <p>
            Your next clue is waiting where water flows,<br>
            but where it goes, nobody knows. 💧
          </p>

          <div class="divider"></div>

          <p>
            Follow the sound and take a look,<br>
            your next surprise is hiding in this nook. 👀
          </p>

        </div>
      `,


      4: `
        <p class="statement">
          You're on a roll, so don't delay!
        </p>

        <div class="clue">

          <p>
            Your next clue is hiding where I used to stay. ❤️
          </p>

          <div class="divider"></div>

          <p>
            A room that holds a little history,<br>
            and maybe a memory or two of me. 😂
          </p>

          <div class="divider"></div>

          <p>
            Go find the room that was once mine...
          </p>

        </div>
      `,


      5: `
        <p class="statement">
          Well done! You found your way.
        </p>

        <div class="clue">

          <p>
            Now go find the place where your bum likes to stay,<br>
            when you're ready to relax at the end of the day. 😂
          </p>

          <div class="divider"></div>

          <p>
            Where you sit back, get comfy and stay,<br>
            especially when you've had a long day.
          </p>

        </div>
      `,


      6: `
        <p class="statement">
          You're getting closer, don't you know?
        </p>

        <div class="clue">

          <p>
            Now to somewhere your clothes like to go. 👗
          </p>

          <div class="divider"></div>

          <p>
            Dresses and shirts all hiding away,<br>
            waiting for you to choose them one day. 😂
          </p>

          <div class="divider"></div>

          <p>
            Go have a look where your clothes stay...
          </p>

        </div>
      `,


      7: `
        <p class="statement">
          Getting tired yet? 😂❤️
        </p>

        <div class="clue">

          <p>
            You're getting closer, don't stop the chase,<br>
            Your next clue is hiding in a very familiar place.
          </p>

          <div class="divider"></div>

          <p>
            It's somewhere soft where you rest your face,<br>
            And hopefully dream of winning this race.
          </p>

        </div>
      `,


      8: `
        <p class="statement">
          Time to leave the bedroom behind... 🌳
        </p>

        <div class="clue">

          <p>
            Your next clue is waiting outside.
          </p>

          <div class="divider"></div>

          <p>
            Look somewhere that gives a little shade,<br>
            Where nature has its own little parade.
          </p>

        </div>
      `,


      9: `
        <p class="statement">
          The garden holds one last surprise! 🌳❤️
        </p>

        <div class="clue">

          <p>
            A birthday braai means fire and food,<br>
            Good drinks, good laughs and a birthday mood. 🎂🔥
          </p>

          <div class="divider"></div>

          <p>
            So where will the flames be burning bright,<br>
            And where will we celebrate your birthday tonight?
          </p>

        </div>
      `,


      10: `
        <p class="statement">
          YOU FOUND IT! 🎉❤️
        </p>

        <div class="clue final-message">

          <p>
            I could have just handed you your birthday present,<br>
            but where's the fun in that? 😂
          </p>

          <div class="divider"></div>

          <p>
            This is a little something towards<br>
            the tattoo you've been wanting. 🖤
          </p>

          <div class="divider"></div>

          <p>
            <strong>Happy Birthday! ❤️🎀</strong>
          </p>

          <p>
            Now go get yourself some ink!
          </p>

        </div>
      `

    };


    /* =========================================
       COLOUR FOR EACH PAGE
    ========================================== */

    const themes = {

      1: "#e63946",
      2: "#9b5de5",
      3: "#00a6c7",
      4: "#e76f51",
      5: "#e85d04",
      6: "#9b5de5",
      7: "#6c63c7",
      8: "#55a630",
      9: "#e85d04",
      10: "#d62839"

    };


    /* =========================================
       GET THE CLUE NUMBER
    ========================================== */

    const params =
      new URLSearchParams(window.location.search);

    const requestedClue =
      parseInt(params.get("clue"));

    const activeNumber =
      clues[requestedClue]
        ? requestedClue
        : 1;


    /* =========================================
       SHOW THE CORRECT CLUE
    ========================================== */

    const container =
      document.getElementById("clue-container");

    container.innerHTML =
      clues[activeNumber];


    /* =========================================
       APPLY THE PAGE THEME
    ========================================== */

    document.body.classList.add(
      "theme" + activeNumber
    );

    document.documentElement.style.setProperty(
      "--accent",
      themes[activeNumber]
    );


    /* =========================================
       FIREWORKS ONLY ON FINAL PAGE
    ========================================== */

    if (activeNumber === 10) {

      document.getElementById("fireworks").style.display =
        "block";

    }

  </script>

</body>
</html>
